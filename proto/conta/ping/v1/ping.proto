syntax = "proto3";

package conta.ping.v1;

// PingService existe só para validar a fundação (Fase 0): contrato, geração de código
// nas duas linguagens, chamada BFF -> Go e trace único.
service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  // Eco da mensagem recebida.
  string message = 1;
  // Nome do serviço que respondeu (ex.: "ledger").
  string service = 2;
}
