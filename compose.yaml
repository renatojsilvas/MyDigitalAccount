# Ponto de entrada do ambiente. Cada arquivo de deploy/compose/ é um grupo (profile):
# core (tools, Postgres, ledger, bff); obs (observabilidade); load (k6); events (Fase 4).
name: conta-digital

include:
  - path: deploy/compose/core.yaml
    # Caminhos relativos (build, volumes) valem a partir da raiz, não de deploy/compose/.
    project_directory: .
  - path: deploy/compose/obs.yaml
    project_directory: .
  - path: deploy/compose/load.yaml
    project_directory: .
