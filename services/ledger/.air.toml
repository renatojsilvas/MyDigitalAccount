# Recarga automática do ledger em desenvolvimento (imagem tools, alvo dev do Dockerfile).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/ledger ./cmd/ledger"
  bin = "./tmp/ledger"
  include_ext = ["go"]
  # Também observa o código gerado do .proto (fora do diretório do serviço): ao regenerar,
  # o ledger recompila sozinho.
  include_dir = [".", "../../gen/go"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  # SIGINT em vez de SIGKILL: o serviço faz graceful shutdown.
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = false

[misc]
  clean_on_exit = true
