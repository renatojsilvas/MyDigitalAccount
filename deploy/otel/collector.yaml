# OpenTelemetry Collector (ADR-0002): único ponto de entrada de telemetria.
# Os serviços falam só OTLP com ele; trocar um backend é mudar este arquivo.
#
#   traces  -> Tempo       (OTLP gRPC)
#   métricas-> Prometheus  (remote write)
#   logs    -> Loki        (OTLP HTTP, endpoint nativo /otlp)

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Métricas do próprio Redis (memória usada, chaves descartadas por falta de memória, clientes),
  # lidas pelo comando INFO. O descarte de chaves é o risco do volatile-lru sobre os contadores
  # do antifraude (ADR-0008). Sem o Redis no ar (profile core desligado), só gera aviso no log.
  redis:
    endpoint: redis:6379
    collection_interval: 10s
    metrics:
      # Opcional, desligada por padrão: o teto contra o qual a memória usada é comparada.
      redis.maxmemory:
        enabled: true

processors:
  # Primeiro da cadeia: recusa dados antes de estourar a memória, em vez de ser morto por OOM.
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp, redis]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
  telemetry:
    metrics:
      readers:
        # Métricas do próprio Collector, raspadas pelo Prometheus em :8888.
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
