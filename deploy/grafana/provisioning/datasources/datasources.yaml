# Datasources como código: nada é configurado à mão na interface do Grafana.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      streamingEnabled:
        search: true
      # Do span para os logs do mesmo trace. O trace_id é metadado estruturado do Loki
      # (vem do contexto do LogRecord OTLP), não texto da linha: por isso a consulta é
      # explícita, com filtro por rótulo, e não o filtro de texto padrão.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{service_name=~".+"} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Do log para o trace: o campo trace_id vira link para o Tempo.
      derivedFields:
        - name: trace_id
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
