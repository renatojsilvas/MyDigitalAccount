# Tempo 3.x em modo monolítico (-target=all), armazenamento local em disco.
# Não precisa de Kafka no modo monolítico (conferido no exemplo oficial single-binary).
# Em produção seria o modo distribuído, com object storage.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Retenção curta: é um ambiente didático e o disco é do seu Docker. No Tempo 3.x o
# compactor deixou de existir; a retenção por tenant fica em overrides (o -config.verify
# aceita esta chave e rejeita chaves desconhecidas).
overrides:
  defaults:
    compaction:
      block_retention: 48h

usage_report:
  reporting_enabled: false
