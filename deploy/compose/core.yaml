# Núcleo do ambiente: ferramentas, Postgres e os serviços da aplicação (ledger e bff).
# Incluído pelo compose.yaml da raiz. Arquivo autocontido: o Compose carrega cada arquivo
# incluído isoladamente, então nada aqui pode referenciar serviço ou volume de outro arquivo.
#
# Subir:   docker compose --profile core up -d --build   (antes: make generate, no tools)
# Parar:   docker compose --profile core down            (down -v apaga os dados)

x-dev-service: &dev-service
  # Mesmo UID/GID do dono do código no host, para não criar arquivos de root no bind mount.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  init: true
  restart: unless-stopped
  volumes:
    - .:/workspace
    - cache:/cache

services:
  # Ferramentas de desenvolvimento. Profile próprio: `docker compose up` não o sobe;
  # `docker compose run --rm tools <comando>` o ativa sozinho.
  tools:
    profiles: ["tools"]
    image: conta-digital/tools:dev
    build:
      context: .
      dockerfile: tools/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace
      - cache:/cache
    environment:
      # Instância de teste (ADR-0003, opção B), lida pelo helper testkit/testpg.
      TEST_POSTGRES_HOST: postgres-test
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      TEST_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Redis real e Toxiproxy para os testes de falha (ADR-0003), lidos por testkit/testredis
      # e testkit/toxi. O teste fala com o Redis direto ou por um proxy que ele mesmo cria.
      TEST_REDIS_ADDR: redis-test:6379
      TEST_TOXIPROXY_URL: http://toxiproxy:8474
      TEST_TOXIPROXY_HOST: toxiproxy
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy

  postgres-test:
    # Profile "tools": é ativado junto com o serviço tools (que depende dele). Profile "test":
    # permite subi-lo sozinho (docker compose --profile test up -d postgres-test).
    profiles: ["tools", "test"]
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # Só para testes: sem durabilidade, em memória. Sem porta publicada: só o tools o alcança.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Redis dos testes: mesma imagem e mesma configuração de memória do redis do core, em memória
  # e sem porta publicada. Cada teste isola as suas chaves por prefixo (testkit/testredis).
  redis-test:
    profiles: ["tools", "test"]
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Toxiproxy (ADR-0003): proxy TCP controlado por API HTTP (:8474). O teste cria um proxy para
  # a dependência (porta escolhida pelo Toxiproxy), conecta-se por ele e injeta a falha:
  # derrubar o proxy (dependência fora do ar), latência, corte de banda ou de conexão. Assim o
  # tools, que não controla o Docker, consegue simular a queda sem parar contêineres.
  toxiproxy:
    profiles: ["tools", "test"]
    image: ghcr.io/shopify/toxiproxy:2.13.0@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
    # A imagem não tem shell: a sonda é o próprio cliente, que falha se a API não responder.
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres:
    profiles: ["core"]
    # Tag + digest: a tag diz o que se espera, o digest garante exatamente os mesmos bytes.
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      # Na imagem 18 o diretório de dados fica em /var/lib/postgresql/18/docker: monta-se o pai.
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Redis do ambiente (seção 4.3 do plano, ADR-0008): uma instância, sem cluster. Não é fonte
  # da verdade (regra 9): sem persistência (save "" e appendonly no) e, por isso, sem volume;
  # reiniciar zera os contadores do antifraude, o que só degrada o score por até 1 h.
  # maxmemory e política de descarte explícitos: toda chave tem TTL, e volatile-lru descarta
  # as menos usadas quando a memória acaba (o risco sobre os contadores está no ADR-0008).
  redis:
    profiles: ["core"]
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Provisiona bancos e papéis de cada serviço (deploy/postgres/bootstrap.sh), de forma
  # idempotente, a cada `up`: funciona num volume novo e num já existente, sem apagar dados.
  # Único serviço, além do próprio Postgres, com a credencial de superusuário; os jobs de
  # migration só rodam depois de ele terminar com sucesso.
  postgres-bootstrap:
    profiles: ["core"]
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    command: ["sh", "/bootstrap/bootstrap.sh"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      BOOTSTRAP_SERVICES: ledger spi transfers
      LEDGER_DB_OWNER_PASSWORD: ${LEDGER_DB_OWNER_PASSWORD:?defina LEDGER_DB_OWNER_PASSWORD no .env}
      LEDGER_DB_APP_PASSWORD: ${LEDGER_DB_APP_PASSWORD:?defina LEDGER_DB_APP_PASSWORD no .env}
      SPI_DB_OWNER_PASSWORD: ${SPI_DB_OWNER_PASSWORD:?defina SPI_DB_OWNER_PASSWORD no .env}
      SPI_DB_APP_PASSWORD: ${SPI_DB_APP_PASSWORD:?defina SPI_DB_APP_PASSWORD no .env}
      TRANSFERS_DB_OWNER_PASSWORD: ${TRANSFERS_DB_OWNER_PASSWORD:?defina TRANSFERS_DB_OWNER_PASSWORD no .env}
      TRANSFERS_DB_APP_PASSWORD: ${TRANSFERS_DB_APP_PASSWORD:?defina TRANSFERS_DB_APP_PASSWORD no .env}
    volumes:
      - ./deploy/postgres/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  ledger:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/ledger:dev
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/services/ledger
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LEDGER_GRPC_ADDR: ":50051"
      LEDGER_ADMIN_ADDR: ":8081"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Papel restrito do serviço: só DML, sem DDL (ADR-0004).
      LEDGER_DB_USER: ledger_app
      LEDGER_DB_PASSWORD: ${LEDGER_DB_APP_PASSWORD:?defina LEDGER_DB_APP_PASSWORD no .env}
      LEDGER_DB_NAME: ledger
      LEDGER_DB_LOCK_TIMEOUT: ${LEDGER_DB_LOCK_TIMEOUT:-1s}
      LEDGER_DB_MAX_CONNS: ${LEDGER_DB_MAX_CONNS:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${LEDGER_GRPC_HOST_PORT:-50051}:50051"
      - "127.0.0.1:${LEDGER_ADMIN_HOST_PORT:-8081}:8081"
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
    # O healthcheck vem do HEALTHCHECK do Dockerfile (curl no alvo dev, subcomando no final).

  # Antifraude (ADR-0008): score por contadores de velocidade no Redis, com falhas injetáveis.
  antifraude:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/antifraude:dev
    build:
      context: .
      dockerfile: services/antifraude/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/services/antifraude
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ANTIFRAUDE_GRPC_ADDR: ":50061"
      ANTIFRAUDE_ADMIN_ADDR: ":8082"
      REDIS_ADDR: redis:6379
      ANTIFRAUDE_REDIS_TIMEOUT: ${ANTIFRAUDE_REDIS_TIMEOUT:-50ms}
      # Falhas injetadas no boot; em execução, troque pelo AntifraudeAdminService.SetFaults.
      ANTIFRAUDE_FAULT_LATENCY: ${ANTIFRAUDE_FAULT_LATENCY:-0s}
      ANTIFRAUDE_FAULT_ERROR_RATE: ${ANTIFRAUDE_FAULT_ERROR_RATE:-0}
      ANTIFRAUDE_DEGRADED_MAX_AMOUNT_CENTS: ${ANTIFRAUDE_DEGRADED_MAX_AMOUNT_CENTS:-50000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${ANTIFRAUDE_GRPC_HOST_PORT:-50061}:50061"
    depends_on:
      # service_started, não service_healthy: o antifraude funciona sem o Redis (degradado,
      # ADR-0008); a dependência só ordena a subida.
      redis:
        condition: service_started

  # Simulador do SPI (seção 4.5 do plano, ADR-0007): liquidação idempotente pelo settlement_id,
  # com modo de liquidação, falha da consulta e latência configuráveis (aqui ou, em execução,
  # pelo SpiAdminService.SetBehavior).
  spi-fake:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/spi-fake:dev
    build:
      context: .
      dockerfile: services/spi-fake/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/services/spi-fake
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SPI_GRPC_ADDR: ":50071"
      SPI_ADMIN_ADDR: ":8083"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SPI_DB_USER: spi_app
      SPI_DB_PASSWORD: ${SPI_DB_APP_PASSWORD:?defina SPI_DB_APP_PASSWORD no .env}
      SPI_DB_NAME: spi
      SPI_SETTLE_MODE: ${SPI_SETTLE_MODE:-settle}
      SPI_FAIL_STATUS_QUERIES: ${SPI_FAIL_STATUS_QUERIES:-false}
      SPI_LATENCY: ${SPI_LATENCY:-0s}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${SPI_GRPC_HOST_PORT:-50071}:50071"
    depends_on:
      spi-migrate:
        condition: service_completed_successfully

  spi-migrate:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/spi-fake:dev
    build:
      context: .
      dockerfile: services/spi-fake/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/services/spi-fake
    command: ["go", "run", "./cmd/spi-fake", "migrate"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SPI_DB_USER: spi_owner
      SPI_DB_PASSWORD: ${SPI_DB_OWNER_PASSWORD:?defina SPI_DB_OWNER_PASSWORD no .env}
      SPI_DB_NAME: spi
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  # Orquestrador do Pix (ADR-0007): aceite idempotente, máquina de estados e limite diário.
  transfers:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/transfers:dev
    build:
      context: .
      dockerfile: services/transfers/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/services/transfers
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRANSFERS_GRPC_ADDR: ":50081"
      TRANSFERS_ADMIN_ADDR: ":8084"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      TRANSFERS_DB_USER: transfers_app
      TRANSFERS_DB_PASSWORD: ${TRANSFERS_DB_APP_PASSWORD:?defina TRANSFERS_DB_APP_PASSWORD no .env}
      TRANSFERS_DB_NAME: transfers
      TRANSFERS_DAILY_LIMIT_CENTS: ${TRANSFERS_DAILY_LIMIT_CENTS:-200000}
      TRANSFERS_REQUEST_HASH_KEY: ${TRANSFERS_REQUEST_HASH_KEY:?defina TRANSFERS_REQUEST_HASH_KEY no .env (mínimo 32 caracteres)}
      TRANSFERS_ANTIFRAUDE_ADDR: antifraude:50061
      TRANSFERS_LEDGER_ADDR: ledger:50051
      TRANSFERS_SPI_ADDR: spi-fake:50071
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${TRANSFERS_GRPC_HOST_PORT:-50081}:50081"
    depends_on:
      transfers-migrate:
        condition: service_completed_successfully
      # service_started: o transfers funciona sem elas (recusa por indisponibilidade ou espera,
      # conforme a etapa, ADR-0007); a dependência só ordena a subida.
      ledger:
        condition: service_started
      antifraude:
        condition: service_started
      spi-fake:
        condition: service_started

  transfers-migrate:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/transfers:dev
    build:
      context: .
      dockerfile: services/transfers/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/services/transfers
    command: ["go", "run", "./cmd/transfers", "migrate"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      TRANSFERS_DB_USER: transfers_owner
      TRANSFERS_DB_PASSWORD: ${TRANSFERS_DB_OWNER_PASSWORD:?defina TRANSFERS_DB_OWNER_PASSWORD no .env}
      TRANSFERS_DB_NAME: transfers
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  # Job de migration: roda uma vez antes do ledger, com o papel dono do schema, e sai. O
  # ledger só sobe se ele terminar com sucesso. Mesma imagem de desenvolvimento do ledger.
  ledger-migrate:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/ledger:dev
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/services/ledger
    command: ["go", "run", "./cmd/ledger", "migrate"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      LEDGER_DB_USER: ledger_owner
      LEDGER_DB_PASSWORD: ${LEDGER_DB_OWNER_PASSWORD:?defina LEDGER_DB_OWNER_PASSWORD no .env}
      LEDGER_DB_NAME: ledger
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  bff:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/bff:dev
    build:
      context: .
      dockerfile: bff/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/bff
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BFF_HOST: 0.0.0.0
      BFF_PORT: "8088"
      LEDGER_GRPC_URL: http://ledger:50051
      LEDGER_TIMEOUT_MS: ${LEDGER_TIMEOUT_MS:-1000}
      LEDGER_BALANCE_TIMEOUT_MS: ${LEDGER_BALANCE_TIMEOUT_MS:-250}
      LEDGER_STATEMENT_TIMEOUT_MS: ${LEDGER_STATEMENT_TIMEOUT_MS:-200}
      BFF_JWT_SECRET: ${BFF_JWT_SECRET:?defina BFF_JWT_SECRET no .env (mínimo 32 caracteres)}
      BFF_JWT_TTL_SECONDS: ${BFF_JWT_TTL_SECONDS:-900}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${BFF_HOST_PORT:-8088}:8088"
    depends_on:
      ledger:
        condition: service_healthy

  # Front-end de demonstração (seção 6.1 do plano): só imagem de desenvolvimento (Vite). O proxy
  # /api -> BFF vive no servidor do Vite, então não há CORS. Sem imagem final: não é um serviço de produção.
  web:
    <<: *dev-service
    profiles: ["core"]
    image: conta-digital/web:dev
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
      additional_contexts:
        tools: docker-image://conta-digital/tools:dev
    working_dir: /workspace/web
    environment:
      BFF_PROXY_TARGET: http://bff:8088
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      bff:
        condition: service_healthy

volumes:
  postgres-data:
  cache:
    # Nome fixo: é o mesmo volume de cache (Go, pnpm, npm) usado pelo serviço tools.
    name: conta-digital_tools-cache
