# Observabilidade (ADR-0002): Collector, Prometheus, Tempo, Loki e Grafana.
# Incluído pelo compose.yaml da raiz. Arquivo autocontido (ver core.yaml).
#
# Subir:   docker compose --profile obs up -d --build
# Parar:   docker compose --profile obs down            (down -v apaga métricas, traces e logs)
#
# Consome memória: se o Docker estiver apertado, suba o obs só quando for usá-lo.

services:
  otel-collector:
    profiles: ["obs"]
    image: conta-digital/otel-collector:obs
    build:
      context: deploy/obs
      args:
        # Sem shell nem wget: o Dockerfile acrescenta um busybox estático só para a sonda.
        BASE: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "--spider", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    # Sem porta publicada: os serviços falam OTLP com ele pela rede do compose (:4317 e :4318).

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # As métricas dos serviços chegam por remote write, vindas do Collector.
      - --web.enable-remote-write-receiver
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    profiles: ["obs"]
    image: conta-digital/tempo:obs
    build:
      context: deploy/obs
      args:
        BASE: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "--spider", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  loki:
    profiles: ["obs"]
    image: conta-digital/loki:obs
    build:
      context: deploy/obs
      args:
        BASE: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    environment:
      # Só dev, e só em 127.0.0.1: sem tela de login, com acesso de administrador.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
